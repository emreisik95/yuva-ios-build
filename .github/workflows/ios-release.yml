name: Encrypted YuVa iOS Build

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Monotonically increasing CFBundleVersion
        required: true
        default: "19"

permissions:
  contents: read

concurrency:
  group: encrypted-yuva-ios-build
  cancel-in-progress: false

jobs:
  test-and-archive:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      XCODEGEN_VERSION: 2.45.3
      XCODEGEN_SHA256: "SHA256: 0c90f4d28ca57335f9fa78cf5bf6dabfe20a232036dabe36de2eef79cb7c0878"
      YUVA_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - name: Check out encrypted mirror
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install GnuPG
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gpg >/dev/null 2>&1; then
            brew install gnupg
          fi
          gpg --version | head -1

      - name: Verify and decrypt source
        shell: bash
        env:
          SOURCE_ARCHIVE_PASSPHRASE: ${{ secrets.SOURCE_ARCHIVE_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_ARCHIVE_PASSPHRASE"
          expected_sha="$(jq -er '.ciphertextSHA256' source-manifest.json)"
          echo "${expected_sha}  source.tar.gpg" | shasum -a 256 --check

          source_root="$RUNNER_TEMP/yuva-source"
          source_tar="$RUNNER_TEMP/yuva-source.tar"
          passphrase_path="$RUNNER_TEMP/source.passphrase"
          mkdir -p "$source_root"
          umask 077
          printf '%s' "$SOURCE_ARCHIVE_PASSPHRASE" > "$passphrase_path"
          gpg --batch --quiet --yes --pinentry-mode loopback \
            --passphrase-file "$passphrase_path" \
            --output "$source_tar" \
            --decrypt source.tar.gpg
          rm -f "$passphrase_path"

          while IFS= read -r member; do
            case "$member" in
              /*|../*|*/../*|*/..)
                echo "unsafe archive member" >&2
                exit 1
                ;;
            esac
          done < <(tar -tf "$source_tar")
          tar -xf "$source_tar" -C "$source_root"
          rm -f "$source_tar"
          test -f "$source_root/ios/HomeSystem/project.yml"
          test -f "$source_root/ios/HomeSystemCore/Package.swift"
          echo "SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          install_root="$RUNNER_TEMP/xcodegen-install"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          expected_sha256="${XCODEGEN_SHA256#SHA256: }"
          echo "${expected_sha256}  ${archive}" | shasum -a 256 --check
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Test transport and domain package
        shell: bash
        run: |
          set -euo pipefail
          "$SOURCE_ROOT/scripts/swift-test.sh" \
            --package-path "$SOURCE_ROOT/ios/HomeSystemCore"

      - name: Generate Xcode project
        working-directory: ${{ env.SOURCE_ROOT }}/ios/HomeSystem
        run: xcodegen generate

      - name: Build app tests
        working-directory: ${{ env.SOURCE_ROOT }}/ios/HomeSystem
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project HomeSystem.xcodeproj \
            -scheme HomeSystem \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=26.2' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/build.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run app tests
        working-directory: ${{ env.SOURCE_ROOT }}/ios/HomeSystem
        shell: bash
        run: |
          set -euo pipefail
          set +e
          xcodebuild test-without-building \
            -project HomeSystem.xcodeproj \
            -scheme HomeSystem \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=26.2' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO
          test_status=$?
          set -e
          if [ "$test_status" -ne 0 ]; then
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/tests.xcresult" \
              --compact || true
          fi
          exit "$test_status"

      - name: Install isolated signing identity and profile
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_ADHOC_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$IOS_DISTRIBUTION_P12_BASE64"
          test -n "$IOS_DISTRIBUTION_P12_PASSWORD"
          test -n "$IOS_ADHOC_PROFILE_BASE64"
          keychain_path="$RUNNER_TEMP/yuva-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          p12_path="$RUNNER_TEMP/yuva-distribution.p12"
          profile_path="$RUNNER_TEMP/YuVa.mobileprovision"
          profile_plist="$RUNNER_TEMP/YuVa-profile.plist"

          echo "::add-mask::$keychain_password"
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$p12_path"
          printf '%s' "$IOS_ADHOC_PROFILE_BASE64" | base64 --decode > "$profile_path"
          chmod 600 "$p12_path" "$profile_path"

          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          app_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          profile_expiration="$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$profile_plist")"
          test "$profile_name" = "YuVa Ad Hoc Local Key 2026"
          test "$app_identifier" = "235UP83FJ4.com.emreisik.HomeSystem"
          test -n "$profile_expiration"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$p12_path" \
            -P "$IOS_DISTRIBUTION_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" \
            | grep -F 'iPhone Distribution: Emre Isik (235UP83FJ4)'

          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_dir"
          cp "$profile_path" "$profile_dir/$profile_uuid.mobileprovision"
          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Validate build number
        shell: bash
        run: |
          set -euo pipefail
          case "$YUVA_BUILD_NUMBER" in
            ''|*[!0-9]*) exit 1 ;;
          esac
          test "$YUVA_BUILD_NUMBER" -gt 13

      - name: Archive signed application
        working-directory: ${{ env.SOURCE_ROOT }}/ios/HomeSystem
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild clean archive \
            -project HomeSystem.xcodeproj \
            -scheme HomeSystem \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/YuVa.xcarchive" \
            DEVELOPMENT_TEAM=235UP83FJ4 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER='YuVa Ad Hoc Local Key 2026' \
            CURRENT_PROJECT_VERSION="$YUVA_BUILD_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      - name: Export signed IPA
        working-directory: ${{ env.SOURCE_ROOT }}/ios/HomeSystem
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/YuVa.xcarchive" \
            -exportPath "$RUNNER_TEMP/YuVaExport" \
            -exportOptionsPlist ExportOptions.plist
          test -s "$RUNNER_TEMP/YuVaExport/YuVa.ipa"

      - name: Encrypt install artifact
        shell: bash
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.ARTIFACT_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_PASSPHRASE"
          passphrase_path="$RUNNER_TEMP/artifact.passphrase"
          plaintext_ipa="$RUNNER_TEMP/YuVaExport/YuVa.ipa"
          encrypted_ipa="$RUNNER_TEMP/YuVa.ipa.gpg"
          umask 077
          printf '%s' "$ARTIFACT_PASSPHRASE" > "$passphrase_path"
          gpg --batch --quiet --yes --pinentry-mode loopback \
            --passphrase-file "$passphrase_path" \
            --symmetric \
            --cipher-algo AES256 \
            --s2k-digest-algo SHA512 \
            --compress-algo none \
            --output "$encrypted_ipa" \
            "$plaintext_ipa"
          rm -f "$passphrase_path" "$plaintext_ipa"
          test -s "$encrypted_ipa"

      - name: Upload encrypted private install artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: YuVa-ad-hoc-encrypted-${{ inputs.build_number }}
          path: ${{ runner.temp }}/YuVa.ipa.gpg
          if-no-files-found: error
          retention-days: 1
